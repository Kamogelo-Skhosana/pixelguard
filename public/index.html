<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

      <a class="brand" href="#/runs">

          <circle cx="12" cy="12" r="6.5" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M12 1v22M1 12h22" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="brand-name">pixelguard</span>
      </a>
      <nav><a href="#/runs">Runs</a> <a href="#/trend">Trend</a></nav>
      <button type="button" class="theme-toggle" id="theme-toggle">Theme: auto</button>
    </header>
    <main id="app">
      <p class="muted">Loading…</p>
    </main>
    <noscript>The pixelguard dashboard needs JavaScript.</noscript>
  </body>
